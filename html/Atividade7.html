<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title> Minha Loja SPA e PWA </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/Atividade7.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d6efd">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#" onclick="carregarPorCategoria('todos')">Minha Floricultura</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#" onclick="carregarPorCategoria('orquidea')">Orquídeas</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="carregarPorCategoria('buque')">Buquês</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="carregarPorCategoria('arranjo')">Arranjos</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="carregarPorCategoria('cesta')">Cestas</a></li>
          <li class="nav-item"><a class="nav-link" href="#" onclick="mostrarContato()">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4 mt-5">
    <h1 class="text-center mb-4"> Loja - SPA com Bootstrap PWA </h1>

    <div id="tela-lista" class="row row-cols-1 row-cols-md-3 g-4 show"></div>

    <div id="tela-detalhes" class="collapse">
      <button class="btn btn-secondary mb-3" onclick="voltar()">← Voltar</button>
      <div id="detalhes-produto" class="card shadow p-3"></div>
    </div>

    <div id="tela-contato" class="collapse">
      <div class="card shadow p-4">
        <h2>Fale Conosco</h2>
        <p><strong>Endereço:</strong> Rua Exemplo, 123 - Centro</p>
        <p><strong>Cidade:</strong> Florianópolis - SC</p>
        <p><strong>Telefone:</strong> (48) 99999-0000</p>
        <p><strong>Email:</strong> contato@minhaloja.com</p>
        <button class="btn btn-secondary mt-3" onclick="voltar()">← Voltar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../javaScript/Atividade7.js"></script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => console.log('Service Worker registrado com sucesso!', reg))
      .catch(err => console.warn('Erro ao registrar o Service Worker:', err));
  }
</script>
</body>
</html>
